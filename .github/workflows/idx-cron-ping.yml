name: Pilar IDX Cron Ping (Jam Bursa BEI)

on:
  schedule:
    # Senin-Jumat setiap 30 menit pada jam bursa BEI:
    # 02:00 - 09:00 UTC = 09:00 - 16:00 WIB
    - cron: '*/30 2-9 * * 1-5'
  workflow_dispatch:

jobs:
  ping-vercel-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint /api/cron/scan di Vercel
        run: |
          if [ -z "${{ secrets.VERCEL_APP_URL }}" ]; then
            echo "Set secret VERCEL_APP_URL di GitHub Repository Settings terlebih dahulu."
            exit 1
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/cron/scan"
